kind: pipeline
type: docker
name: esprit_chatbot-langchain-rag-service ci quality

trigger:
  branch:
    - release/*
  event:
    - push

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: cache
    host:
      path: /tmp/cache
  - name: m2-settings
    host:
      path: /tmp/m2-settings

steps:
# =========================
# 1. INSTALL + TEST + COVERAGE
# =========================
  - name: unit-tests
    image: python:3.9

    environment:
      PYTHONPATH: /drone/src

    commands:
      - pwd
      - ls -la
      - python --version

      - python -m venv venv
      - . venv/bin/activate

      - pip install --upgrade pip setuptools wheel cython

      # Match DEV environment versions
      - pip install pysonar==1.6.0.4905
      - pip install coverage==7.10.7
      - pip install pytest==8.4.2
      - pip install pytest-asyncio==1.2.0
      - pip install pytest-cov==7.1.0

      # Missing test dependencies
      - pip install httpx==0.27.2
      - pip install respx
      - pip install llama-cpp-python

      - pip install "PyYAML>5.3,<6.0"
      - pip install -r requirements.txt

      # Diagnostics
      - python -c "import fastapi, starlette, httpx; print('FastAPI=', fastapi.__version__)"
      - python -c "import fastapi, starlette, httpx; print('Starlette=', starlette.__version__)"
      - python -c "import fastapi, starlette, httpx; print('httpx=', httpx.__version__)"
      -
      - python -c "import sys; print(sys.path)"
      - python -c "import app; print(app.__file__)"
      - python -c "import respx; print('respx OK')"
      - python -c "import llama_cpp; print('llama_cpp OK')"

      # Tests + Coverage
      - pytest tests --cov=. --cov-report=xml:coverage.xml --cov-report=term

# =========================
# 2. SONARQUBE ANALYSIS
# =========================
  - name: sonar-scanner
    image: sonarsource/sonar-scanner-cli:latest

    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token

    commands:
      - ls -lh coverage.xml
      - >
        sonar-scanner
        -Dsonar.projectKey=langchain-rag-service
        -Dsonar.projectName=langchain-rag-service
        -Dsonar.sources=app
        -Dsonar.tests=tests
        -Dsonar.test.inclusions=tests/**/*.py
        -Dsonar.host.url=$SONAR_HOST_URL
        -Dsonar.token=$SONAR_TOKEN
        -Dsonar.python.coverage.reportPaths=coverage.xml
        -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**
        -Dsonar.working.directory=/tmp/.scannerwork

    when:
      status:
      - success


  - name: build and publish
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    settings:
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      dockerfile: Dockerfile
      experimental: true
      repo: 192.168.0.128:5000/esprit-chatbot.esprit.tn/langchain-rag-service
      registry: 192.168.0.128:5000
      insecure: true
      tags:
        - ${DRONE_COMMIT:0:7}-qa

  - name: git-ops (patch and push)
    image: alpine/git
    environment:
      GIT_OPS_SSH_KEY:
        from_secret: ssh_key_github_dsi-application
    commands:
      - mkdir -p ~/.ssh && echo "$GIT_OPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan github.com >> ~/.ssh/known_hosts
      - git clone git@github.com:ESPRIT-DSI-OPS/esprit-dsi_gitops.git
      - cd esprit-dsi_gitops/esprit-chatbot/qa
      - sed -E -i "s|192.168.0.128:5000/esprit-chatbot.esprit.tn/langchain-rag-service:[^ ]+|192.168.0.128:5000/esprit-chatbot.esprit.tn/langchain-rag-service:${DRONE_COMMIT:0:7}-qa|g" langchain-rag-service.yaml
      - git config --global user.name "drone-ci"
      - git config --global user.email "drone-ci.qa@esprit.tn"
      - git add .
      - git commit -m "update esprit-chatbot langchain-rag-service commit ${DRONE_COMMIT:0:7}-qa"
      - git push -f origin master


  - name:  success notification
    image: drillster/drone-email
    settings:
      from: Drone-CI QA <notification-ops-qa@esprit.tn>
      host: smtp.office365.com
      port: 587
      username:
        from_secret: email_username_outlook
      password:
        from_secret: email_password_outlook
      recipients_only: true
      recipients:
        - seddik.bouzayani@esprit.tn
        - saria.essid@esprit.tn
      subject: SUCCESS - ${DRONE_STAGE_NAME} pipeline [${DRONE_COMMIT:0:7}-qa]
      body: |
        The Pipeline ${DRONE_STAGE_NAME} has completed successfully.
        <br>
        Git Commit : ${DRONE_COMMIT:0:7}-qa | Git Event : ${DRONE_BUILD_EVENT}
        <br>
        Git Branch : ${DRONE_BRANCH} | Git REF : ${DRONE_COMMIT_REF} 
        <br>
        Git Branch Source : ${DRONE_SOURCE_BRANCH} | Git Branch Target : ${DRONE_TARGET_BRANCH}
        <br>
        Git Author : ${DRONE_COMMIT_AUTHOR}
        <br>
        Link: ${DRONE_BUILD_LINK}
    when:
      status:
        - success

  - name:  failure notification
    image: drillster/drone-email
    settings:
      from: Drone-CI QA <notification-ops-qa@esprit.tn>
      host: smtp.office365.com
      port: 587
      username:
        from_secret: email_username_outlook
      password:
        from_secret: email_password_outlook
      recipients_only: true
      recipients:
        - seddik.bouzayani@esprit.tn
        - saria.essid@esprit.tn
      subject: FAILURE ${DRONE_STAGE_NAME} pipeline [${DRONE_COMMIT:0:7}-qa]
      body: |
        The Pipeline ${DRONE_STAGE_NAME} has failed. 
        <br>
        Git Commit : ${DRONE_COMMIT:0:7}-qa | Git Event : ${DRONE_BUILD_EVENT}
        <br>
        Git Branch : ${DRONE_BRANCH} | Git REF : ${DRONE_COMMIT_REF} 
        <br>
        Git Branch Source : ${DRONE_SOURCE_BRANCH} | Git Branch Target : ${DRONE_TARGET_BRANCH}
        <br>
        Git Author : ${DRONE_COMMIT_AUTHOR}
        <br>
        Link: ${DRONE_BUILD_LINK}
    when:
      status:
        - failure
